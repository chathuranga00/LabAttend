server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: labattend-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/labattend_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

# Custom LabAttend Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}"
  mail:
    host: ${SPRING_MAIL_HOST:${SMTP_HOST:}}
    port: ${SPRING_MAIL_PORT:${SMTP_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${SMTP_USER:}}
    password: ${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
    from: ${MAIL_FROM_ADDRESS:no-reply@labattend.nsbm.ac.lk}
    student-site-url: ${STUDENT_SITE_URL:http://localhost:5174}
  rate-limiting:
    enabled: true
    login:
      max-requests: 10
      window-seconds: 60
    student-action:
      max-requests: 5
      window-seconds: 60
    account-lockout:
      max-failed-attempts: 5
      lockout-seconds: 300
    scan:
      max-requests: 120
      window-seconds: 60
    bulk-qr:
      max-requests: 30
      window-seconds: 60
  bootstrap:
    admin-email: ${INITIAL_ADMIN_EMAIL:admin@labattend.local}
    admin-password: ${INITIAL_ADMIN_PASSWORD:Admin@123456}
    admin-name: ${INITIAL_ADMIN_NAME:System Administrator}
  qr:
    hmac-secret: ${QR_HMAC_SECRET:c7b9e1a84f30d25e89a1c6b5d4e3f2a1087654321fedcba0123456789abcdef0}
    bulk-max-students: ${QR_BULK_MAX_STUDENTS:500}
    bulk-rate-limit-per-minute: ${QR_BULK_RATE_LIMIT:30}


