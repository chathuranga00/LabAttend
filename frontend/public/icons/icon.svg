<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Corner QR frame corners -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 120 332 L 120 372 A 20 20 0 0 0 140 392 L 180 392" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 332 392 L 372 392 A 20 20 0 0 0 392 372 L 392 332" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Central Stylized 'LA' Shield / Monogram -->
  <g fill="none" stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- L shape -->
    <path d="M 190 190 L 190 320 L 260 320" />
    <!-- A shape -->
    <path d="M 270 320 L 310 190 L 350 320" />
    <path d="M 285 280 L 335 280" />
  </g>
  <!-- Verified Attendance Check Accent -->
  <circle cx="360" cy="160" r="26" fill="#10b981"/>
  <path d="M 349 160 L 357 168 L 373 152" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

