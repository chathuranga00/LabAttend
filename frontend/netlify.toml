[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # VITE_API_BASE_URL is the public backend URL that Vite inlines into the
  # client bundle by design; it is not a secret, so skip it in secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL"

# SPA Fallback rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control Headers for Service Worker and HTML
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Immutable long-term caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
